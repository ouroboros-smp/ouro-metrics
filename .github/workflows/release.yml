name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, crucible-pc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - name: Verify tag matches the project version
        shell: bash
        run: |
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build and test all modules
        run: ./gradlew clean build --no-daemon --stacktrace --console=plain
      - name: Stage unambiguous platform artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp "fabric-mod/build/libs/OuroMetrics-${version}.jar" "release-assets/OuroMetrics-fabric-${version}.jar"
          cp "folia-plugin/build/libs/OuroMetrics-${version}.jar" "release-assets/OuroMetrics-folia-${version}.jar"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          generate_release_notes: true
